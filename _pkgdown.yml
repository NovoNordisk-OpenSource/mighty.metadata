url: https://nn-opensource.github.io/mighty.metadata

template:
  bootstrap: 5

reference:
  - title: Study level metadata
    description: |
      Work with ADaM metadata for an entire study.
    contents:
    - mighty_study
    - populate_core
    - populate_sparse
    - create_md_col
  - title: Domain level metadata
    description: |
      Work with metadata for a single ADaM data set.
    contents:
    - mighty_domain
    - columns
    - rows
    - parameters
  - title: Utilities
    description: |
      Utilities for building ADaM metadata from source data.
    contents:
    - build_adam_metadata
    - reexports
