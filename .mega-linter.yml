---
# MegaLinter configuration for R packages
# Documentation: https://megalinter.io/configuration/

# Apply all formatters and linters
APPLY_FIXES: all

# Enable specific linters for R ecosystem
ENABLE_LINTERS:
  - R_LINTR
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - MARKDOWN_MARKDOWNLINT
  - JSON_JSONLINT
  - BASH_SHELLCHECK

# Disable linters that may conflict with R package structure
DISABLE_LINTERS:
  - SPELL_CSPELL # Often conflicts with R-specific terms
  - COPYPASTE_JSCPD # Can be noisy with R package structure

# Configure specific linters
YAML_PRETTIER_ARGUMENTS: --tab-width 2
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json

# File filtering
FILTER_REGEX_EXCLUDE: |
  (?i)(\.Rproj\.user|\.git|node_modules|\.vscode|packrat|renv)

# R-specific filtering
R_LINTR_FILTER_REGEX_EXCLUDE: |
  (tests/testthat/_snaps/|\.Rproj\.user/)

# Report configuration
PRINT_ALPACA: false
PRINT_ALL_FILES: false
DEFAULT_WORKSPACE: /tmp/lint
