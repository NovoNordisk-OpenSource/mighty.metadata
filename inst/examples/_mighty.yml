id: ADVS
label: Vital Signs Analysis Dataset
class: BASIC DATA STRUCTURE
structure: One record per vital sign parameter, per visit, per subject
keys: [USUBJID, PARAMCD, AVISITN]
comment: |
  This is an example comment with extra information

population:
  base:
    - domain: lb
      depends:
        - lbtestcd
      filter: lbtestcd == "B"
    - domain: eg
      depends:
        - egtestcd
      filter: egtestcd == "A"
  global:
    - filter: SAFFL == "Y"
      depends:
       - SAFFL
    
columns:
  - id: STUDYID
    label: Study Identifier
    format: 
      type: integer
      length: 2
      display: "2."
    origin: Predecessor
    codelist: id of codelist
    method: VS.STUDYID

  - id: USUBJID
    label: Unique Subject Identifier
    method: VS.USUBJID

  - id: SAFFL
    label: Safety Population Flag
    method: ADSL.SAFFL
    component:
      id: predecessor
      with:
        source: ADSL
        variable: SAFFL
        by: USUBJID
  
  - id: TRTP
    label: Planned Treatment
    method: ADSL.TRT01P
    component:
      id: copy_merge # To be made
      with:
        variable: TRTP
        source: ADSL
        column: TRT01P
        by: USUBJID

  - id: VISITNUM
    label: Visit Number
    method: SV.VISITNUM

  - id: VISIT
    label: Visit Name
    method: SV.VISIT

  - id: AVISITN
    label: Analysis Visit (N)
    method: VISITNUM
    component:
      id: copy # to be made
      with:
        input: VISITNUM
        variable: AVISITN
  
  - id: AVISIT
    label: Analysis Visit
    method: VISIT converted to title case
    component:
      id: title_case # to be made
      with:
        input: VISIT
        variable: AVISIT
  
  - id: PARAMCD
    label: Parameter Code
    method: For readings in VS set to VS.VSTESTCD. Otherwise see parameters.
    component:
      id: copy # to be made
      with:
        input: VSTESTCD
        variable: PARAMCD
  
  - id: PARAM
    label: Parameter
    method: For readings in VS set to VS.VSTEST. Otherwise see parameters.
    component:
      id: copy # to be made
      with:
        input: VSTEST
        variable: PARAM
  
  - id: AVAL
    label: Analysis Value
    method: For readings in VS set to VS.VSSTRESN. Otherwise see parameters.
    component:
      id: copy # to be made
      with:
        input: VSSTRESN
        variable: AVAL
  
  - id: AVALC
    label: Analysis Value (C)

  - id: BLBMIGRP
    label: BMI Group at baseline
    method: AVALC where PARAMCD = "BMIGRP" for the baseline visit
    depends:
      - rows.baseline
      - parameters.BMIGRP # Either explicit or from component
    component:
      id: bds_copy_param
      with:
        variable: BMIGRP
        paramcd: BMIGRP
        input: AVALCs

rows:
  - id: baseline
    method: Add baseline visit as a new row
    component:
      id: add_baseline_visit # To be made
      with:
        first_treatment_visit: n

parameters: # Only additional parameters to be cacluated not coming from base domain
  - id: BMI
    label: Body Mass Index (kg/m^2)
    columns:
      - id: AVAL
        method: Derive AVAL as Body Mass Index based on height and weight
    component:
      id: bds_bmi # to be made
      with:
        height: HEIGHT
        weight: WEIGHT
        by: [USUBJID, AVISITN]
    
  - id: BMIGRP
    label: Body Mass Index Group
    depends: parameters.BMI
    columns:
      - id: AVALC
        method: BMI grouped in <20, 20-<25, 25-<30, 30+
      - id: AVAL
        method: Set AVAL to numeric representation of AVALC for sorting purposes
    component:
      id: bds_groups # to be made
      with:
        input: BMI
        output: BMIGRP
        bins: [0, 20, 25, 30, 100] # which bin => AVAL
        labels: ["<20", "20-<25", "25-<30", "30+"] # => AVALC
