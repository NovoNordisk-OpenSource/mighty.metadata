---
$schema: "https://json-schema.org/draft-07/schema#"
title: Referenced Documents Schema
description: Schema for referenced documents in clinical trial metadata
type: object
properties:
  doctype:
    type: string
    description: Type of the document
  href:
    type: string
    description: Hyperlink reference to the document
  title:
    type: string
    description: Title of the document
  pdfpagereftype:
    type: string
    enum: [PhysicalRef, NamedDestination]
    description: Type of PDF page reference
  pdfpagerefs:
    type: [string, array]
    items:
      type: string
    description: PDF page references (can be a single string or an array of strings)
  references:
    type: array
    items:
      type: object
      properties:
        table:
          type: string
          description: Table name referenced in the document
        column:
          type: string
          description: Column name referenced in the document
        whereclause:
          type: string
          description: Where clause for the reference
        displayidentifier:
          type: string
          description: Display identifier for the reference
        resultidentifier:
          type: string
          description: Result identifier for the reference
      required: [table, column]
    description: Array of references to specific parts of the document
required: [doctype, href, title]
