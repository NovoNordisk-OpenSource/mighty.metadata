---
$schema: "https://json-schema.org/draft-07/schema#"
title: Codelist Schema
description: Schema for codelists in clinical trial metadata
type: object
properties:
  xmlcodelist:
    type: string
    description: XML codelist identifier
  codelistname:
    type: string
    description: Name of the codelist
  codelistdescription:
    type: string
    description: Description of the codelist
  codelistdatatype:
    type: string
    enum: [text, integer, float, date]
    description: Data type of the codelist values
  codes:
    type: array
    items:
      type: object
      properties:
        codedvaluechar:
          type: string
          description: Character representation of the coded value
        codedvaluenum:
          type: [number, "null"]
          description: Numeric representation of the coded value (if applicable)
        decodetext:
          type: string
          description: Decoded text or label for the coded value
      required: [codedvaluechar, decodetext]
    description: Array of code-decode pairs
required:
  [xmlcodelist, codelistname, codelistdescription, codelistdatatype, codes]
